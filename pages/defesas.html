<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defesas de Tese — Labiofun</title>
    <meta name="description" content="Defesas de dissertações e teses do Laboratório de Biofísica de Fungos (Labiofun) - UFRJ.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css?v=20261104b">
    <link rel="stylesheet" href="../css/animations.css?v=20261104b">
    <link rel="stylesheet" href="../css/styles.css?v=20261104b">
    <link rel="stylesheet" href="../css/modern-ux.css?v=20261104b">
    <script src="../js/components.js?v=20261104b"></script>
    <style>
        .breadcrumb { display: flex; align-items: center; justify-content: center; gap: var(--space-sm); margin-bottom: var(--space-xl); font-size: var(--font-size-sm); opacity: .75; }
        .breadcrumb a { color: var(--white); }

        /* Defesa card */
        .defesas-list { display: flex; flex-direction: column; gap: var(--space-lg); }
        .defesa-item { display: flex; gap: var(--space-xl); align-items: flex-start; background: var(--white); border-radius: var(--radius-lg); padding: var(--space-xl); box-shadow: var(--shadow-md); border: 1px solid var(--light-gray); transition: box-shadow var(--transition-base); }
        .defesa-item:hover { box-shadow: var(--shadow-xl); }
        .defesa-icon-box { background: var(--gradient-primary); color: var(--white); border-radius: var(--radius-md); padding: var(--space-md) var(--space-lg); text-align: center; min-width: 72px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .defesa-icon-box i { font-size: 2rem; margin-bottom: 4px; }
        .defesa-icon-box span { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
        .defesa-info h3 { color: var(--primary); font-size: var(--font-size-xl); margin-bottom: var(--space-xs); }
        .defesa-info p { color: var(--dark-gray); font-size: var(--font-size-sm); line-height: var(--line-height-relaxed); margin: 0 0 4px; }

        /* Countdown Gamified Styles */
        .defesa-hero { background: radial-gradient(circle at center, #1a252c, #0a0f13); color: white; padding: 100px 0 var(--space-3xl); text-align: center; position: relative; overflow: hidden; }
        .defesa-glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-2xl); padding: var(--space-3xl) var(--space-xl); position: relative; z-index: 1; max-width: 900px; margin: 0 auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .candidate-avatar { width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--accent); box-shadow: 0 0 30px rgba(231, 76, 60, 0.4); object-fit: cover; margin: -100px auto var(--space-xl); display: block; background: var(--dark); position: relative; z-index: 2;}
        .countdown-container { display: flex; justify-content: center; gap: var(--space-lg); margin: var(--space-2xl) 0; flex-wrap: wrap; }
        .countdown-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-lg); padding: var(--space-lg); min-width: 110px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .countdown-number { display: block; font-size: 3.5rem; font-weight: 900; line-height: 1; background: linear-gradient(135deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: monospace; }
        .countdown-label { font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--gray); margin-top: var(--space-sm); display: block; }
        .candidate-name { font-size: var(--font-size-3xl); margin-bottom: var(--space-xs); font-weight: 800; background: linear-gradient(135deg, #fff, #e0e0e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .defense-type { font-size: var(--font-size-lg); color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: var(--space-lg); display: block;}
        
        .empty-state { padding: var(--space-3xl); text-align: center; color: var(--gray); }

        @media (max-width: 768px) {
            .page-hero h2 { font-size: var(--font-size-3xl); }
            .defesa-item { flex-direction: column; }
            .countdown-box { min-width: 80px; padding: var(--space-md); }
            .countdown-number { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    <div class="scroll-progress-bar" id="scroll-progress"></div>

    <labiofun-header></labiofun-header>

    <main id="main-content" role="main">
        <section class="hero" style="padding-top: calc(var(--space-2xl) + 60px);">
            <div class="container hero-content">
                <div class="breadcrumb" style="position:relative; z-index:2; justify-content:center; display:flex; gap:0.5rem; margin-bottom:1rem; color:white; opacity:0.8;">
                    <a href="../index.html" style="color:white;"><i class="fas fa-home"></i> Início</a>
                    <i class="fas fa-chevron-right" style="font-size:.6rem; margin-top:5px;"></i>
                    <a href="noticias.html" style="color:white;"><i class="fas fa-newspaper"></i> Notícias</a>
                    <i class="fas fa-chevron-right" style="font-size:.6rem; margin-top:5px;"></i>
                    <span>Defesas de Tese</span>
                </div>
                <h2 class="scroll-animate"><i class="fas fa-graduation-cap" style="margin-right:.5rem"></i>Defesas de Tese</h2>
                <p class="scroll-animate delay-200">Dissertações de mestrado, teses de doutorado e defesas de pós-doutoramento orientadas pelo Labiofun.</p>
            </div>
        </section>

        <!-- Content -->
        <!-- Main Content -->
        <div id="defense-content-area">
            <section class="about" style="padding: var(--space-3xl) 0;">
                <div class="container">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <p>Carregando cronograma...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <labiofun-footer></labiofun-footer>

    <button id="scroll-top" class="scroll-top" aria-label="Voltar ao topo"><i class="fas fa-arrow-up"></i></button>

    <!-- Data Files -->
    <script src="../data/seminarios.js?v=20261104b" defer></script>
    <script src="../js/seminars-sheet.js?v=20261104e" defer></script>
    <script src="../data/team.js?v=20261104b" defer></script>
    <script src="../data/alumni.js?v=20261104b" defer></script>
    <script src="../data/publications.js?v=20261104b" defer></script>
    <script src="../data/books.js?v=20261104b" defer></script>
    <script src="../data/collaborators.js?v=20261104b" defer></script>
    <script src="../js/translations.js?v=20261104d" defer></script>
    <script src="../js/language-switcher.js?v=20261104b" defer></script>
    <script src="../js/bell.js?v=20261104e" defer></script>
    <script src="../js/main.js?v=20261104b"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => (window.seminarsReady || Promise.resolve()).then(() => {
            const contentArea = document.getElementById('defense-content-area');
            const baseDate = new Date(); // Current date

            try {
                if (typeof seminarsData !== 'undefined' && seminarsData.length > 0) {
                // Find future defenses (type === 'exam')
                const futureDefenses = seminarsData
                    .map(s => {
                        const [y, m, d] = s.date.split('-');
                        const evtDate = new Date(y, m - 1, d, 15, 0, 0);
                        return { ...s, timeObj: evtDate };
                    })
                    .filter(s => s.type === 'exam' && s.timeObj.getTime() >= baseDate.getTime())
                    .sort((a, b) => a.timeObj - b.timeObj);

                if (futureDefenses.length > 0) {
                    let htmlContent = '<div style="display: flex; flex-direction: column; gap: var(--space-3xl);">';
                    
                    futureDefenses.forEach((nextDef, index) => {
                        // Match with team data for avatar
                        let avatarSrc = '../images/ufrj.png'; // Fallback
                        if (typeof currentTeam !== 'undefined') {
                            const matchedMember = currentTeam.find(m => m.name.toLowerCase().includes(nextDef.presenter.toLowerCase()));
                            if (matchedMember && matchedMember.image) {
                                avatarSrc = '../' + matchedMember.image;
                            }
                        }

                        // Translate defense type
                        let typeLabel = "Defesa de Tese";
                        if (nextDef.titleKey && nextDef.titleKey.includes('tcc')) typeLabel = "Defesa de TCC";
                        if (nextDef.titleKey && nextDef.titleKey.includes('masters')) typeLabel = "Defesa de Mestrado";
                        if (nextDef.titleKey && nextDef.titleKey.includes('admission')) typeLabel = "Seminário de Exame/Qualificação";

                        const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                        const formattedDateStr = nextDef.timeObj.toLocaleDateString('pt-BR', optionsDate);
                        
                        const titleDisplay = nextDef.title ? `<p style="color: white; font-style: italic; margin-bottom: var(--space-md); max-width: 80%; margin-left: auto; margin-right: auto;">"${nextDef.title}"</p>` : '';

                        htmlContent += `
                            <section class="defesa-hero" style="background: ${index % 2 === 0 ? 'radial-gradient(circle at center, #1a252c, #0a0f13)' : 'radial-gradient(circle at center, #2c1a1a, #130a0a)'}; padding: 80px 0;">
                                <div class="container">
                                    <div class="defesa-glass-panel">
                                        <img src="${avatarSrc}" alt="${nextDef.presenter}" class="candidate-avatar">
                                        <span class="defense-type">${typeLabel}</span>
                                        <h3 class="candidate-name">${nextDef.presenter}</h3>
                                        ${titleDisplay}
                                        <p style="color: rgba(255,255,255,0.7); margin-bottom: var(--space-xl);"><i class="fas fa-calendar-alt"></i> ${formattedDateStr} às 15:00</p>
                                        
                                        <div class="countdown-container" id="countdown-container-${index}">
                                            <div class="countdown-box">
                                                <span class="countdown-number" id="cd-days-${index}">00</span>
                                                <span class="countdown-label">Dias</span>
                                            </div>
                                            <div class="countdown-box">
                                                <span class="countdown-number" id="cd-hours-${index}">00</span>
                                                <span class="countdown-label">Horas</span>
                                            </div>
                                            <div class="countdown-box">
                                                <span class="countdown-number" id="cd-mins-${index}">00</span>
                                                <span class="countdown-label">Min</span>
                                            </div>
                                            <div class="countdown-box">
                                                <span class="countdown-number" id="cd-secs-${index}">00</span>
                                                <span class="countdown-label">Seg</span>
                                            </div>
                                        </div>
                                        
                                        <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Defesa+-+${encodeURIComponent(nextDef.presenter)}&dates=${nextDef.date.replace(/-/g, '')}T180000Z/${nextDef.date.replace(/-/g, '')}T200000Z&details=Defesa+agendada+pelo+Labiofun" target="_blank" class="btn" style="background: var(--accent); color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: var(--space-md); display: inline-block;">
                                            <i class="fas fa-calendar-plus"></i> Adicionar à Agenda
                                        </a>
                                    </div>
                                </div>
                            </section>
                        `;
                    });
                    
                    htmlContent += '</div>';
                    contentArea.innerHTML = htmlContent;

                    // Start countdown logic
                    futureDefenses.forEach((nextDef, index) => {
                        const targetTime = nextDef.timeObj.getTime();
                        
                        function updateCountdown() {
                            const now = new Date().getTime();
                            const diff = targetTime - now;

                            const elDays = document.getElementById(`cd-days-${index}`);
                            const elHours = document.getElementById(`cd-hours-${index}`);
                            const elMins = document.getElementById(`cd-mins-${index}`);
                            const elSecs = document.getElementById(`cd-secs-${index}`);
                            
                            if (!elDays) return;

                            if (diff <= 0) {
                                elDays.textContent = "00";
                                elHours.textContent = "00";
                                elMins.textContent = "00";
                                elSecs.textContent = "00";
                                return;
                            }

                            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                            const secs = Math.floor((diff % (1000 * 60)) / 1000);

                            elDays.textContent = days.toString().padStart(2, '0');
                            elHours.textContent = hours.toString().padStart(2, '0');
                            elMins.textContent = mins.toString().padStart(2, '0');
                            elSecs.textContent = secs.toString().padStart(2, '0');
                        }
                        
                        updateCountdown();
                        setInterval(updateCountdown, 1000);
                    });

                } else {
                    // No future defenses found
                    contentArea.innerHTML = `
                        <section class="about" style="padding: var(--space-3xl) 0;">
                            <div class="container">
                                <div style="text-align: center; padding: 50px; background: white; border-radius: 20px; box-shadow: var(--shadow-sm);">
                                    <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--light-gray); margin-bottom: 20px;"></i>
                                    <h3>Nenhuma Defesa Agendada</h3>
                                    <p style="color: var(--gray);">Acompanhe nossa aba de Notícias para novidades no calendário acadêmico.</p>
                                </div>
                            </div>
                        </section>
                    `;
                }
            } else {
                contentArea.innerHTML = `
                    <section class="about" style="padding: var(--space-3xl) 0;">
                        <div class="container">
                            <div style="text-align: center; padding: 50px; background: white; border-radius: 20px; box-shadow: var(--shadow-sm); color: red;">
                                <i class="fas fa-exclamation-triangle" style="font-size: 4rem; margin-bottom: 20px;"></i>
                                <h3>Erro ao Carregar Dados</h3>
                                <p>Não foi possível carregar os dados de seminários e defesas. Verifique a conexão ou os arquivos de dados.</p>
                            </div>
                        </div>
                    </section>
                `;
            }
            } catch (err) {
                contentArea.innerHTML = `<div style="color:red; padding:20px; background:white;">Error: ${err.message}<br>${err.stack}</div>`;
                console.error(err);
            }
        }));
    </script>
</body>
</html>
