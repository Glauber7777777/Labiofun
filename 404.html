        :root { --primary: #2a623d; --blue: #234a6e; --text: #2c3338; --muted: #6b7378; --bg: #f6f8f7; --card: #fff; }
        @media (prefers-color-scheme: dark) { :root { --text: #e8ecea; --muted: #a9b2ae; --bg: #151a19; --card: #1f2624; --primary: #4caf73; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
        .card { background: var(--card); max-width: 560px; width: 100%; border-radius: 20px; padding: 40px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .big { font-size: 4rem; line-height: 1; margin-bottom: 8px; }
        h1 { color: var(--primary); margin: 8px 0 12px; font-size: 1.6rem; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
        nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        nav a { text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--primary); color: var(--primary); font-weight: 600; }
        nav a.main { background: var(--primary); color: #fff; }
        footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 16px; }
    </style>
</head>
