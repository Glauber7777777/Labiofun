<!DOCTYPE html>

    <title>Página não encontrada | Labiofun</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        :root { --primary: #2a623d; --blue: #234a6e; --text: #2c3338; --muted: #6b7378; --bg: #f6f8f7; --card: #fff; }
        @media (prefers-color-scheme: dark) { :root { --text: #e8ecea; --muted: #a9b2ae; --bg: #151a19; --card: #1f2624; --primary: #4caf73; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
        header { background: linear-gradient(135deg, #2a623d, #234a6e); color: #fff; padding: 18px 16px; text-align: center; }
        header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.15rem; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
        .card { background: var(--card); max-width: 560px; width: 100%; border-radius: 20px; padding: 40px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .big { font-size: 4rem; line-height: 1; margin-bottom: 8px; }
        h1 { color: var(--primary); margin: 8px 0 12px; font-size: 1.6rem; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
        nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        nav a { text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--primary); color: var(--primary); font-weight: 600; }
        nav a.main { background: var(--primary); color: #fff; }
        footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 16px; }
    </style>
</head>
<body>
    <header><a href="/" data-t="lab">Laboratório de Biofísica de Fungos</a></header>
    <main>
        <div class="card">
            <div class="big" aria-hidden="true">🍄</div>
            <h1 data-t="h1">Página não encontrada</h1>
            <p data-t="p">Este endereço não existe ou mudou de lugar. Como um esporo levado pelo vento, ele foi parar em outro canto.</p>
            <nav aria-label="Atalhos">
                <a class="main" href="/" data-t="home">Página inicial</a>
                <a href="/index.html#publications-page" data-t="pubs">Publicações</a>
                <a href="/pages/fungilingo.html">Fungilingo</a>
                <a href="/pages/contact.html" data-t="contact">Contato</a>
            </nav>
        </div>
    </main>
    <footer>© Labiofun · UFRJ</footer>
    <script>
    (function () {
        var T = {
            en: { title: 'Page not found | Labiofun', lab: 'Fungal Biophysics Laboratory', h1: 'Page not found', p: 'This address does not exist or has moved. Like a spore carried by the wind, it landed somewhere else.', home: 'Home page', pubs: 'Publications', contact: 'Contact', nav: 'Shortcuts' },
            'es-ES': { title: 'Página no encontrada | Labiofun', lab: 'Laboratorio de Biofísica de Hongos', h1: 'Página no encontrada', p: 'Esta dirección no existe o ha cambiado de lugar. Como una espora llevada por el viento, fue a parar a otro rincón.', home: 'Página de inicio', pubs: 'Publicaciones', contact: 'Contacto', nav: 'Accesos directos' },
            'fr-FR': { title: 'Page introuvable | Labiofun', lab: 'Laboratoire de Biophysique des Champignons', h1: 'Page introuvable', p: "Cette adresse n'existe pas ou a été déplacée. Comme une spore emportée par le vent, elle a atterri ailleurs.", home: "Page d'accueil", pubs: 'Publications', contact: 'Contact', nav: 'Raccourcis' }
        };
        var l = 'pt-BR';
        try { l = localStorage.getItem('labiofun-language') || ''; } catch (e) { }
        if (!l) { var n = (navigator.language || '').toLowerCase(); l = n.indexOf('en') === 0 ? 'en' : n.indexOf('es') === 0 ? 'es-ES' : n.indexOf('fr') === 0 ? 'fr-FR' : 'pt-BR'; }
        l = { es: 'es-ES', fr: 'fr-FR' }[l] || l;
        var d = T[l]; if (!d) return;
        document.documentElement.lang = l; document.title = d.title;
        document.querySelectorAll('[data-t]').forEach(function (el) { var v = d[el.getAttribute('data-t')]; if (v) el.textContent = v; });
        var nav = document.querySelector('nav'); if (nav) nav.setAttribute('aria-label', d.nav);
    })();
    </script>
</body>
</html>
